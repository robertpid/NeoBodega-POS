<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a, #3b0764); }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .animated-bg {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, rgba(0,0,0,0) 50%);
            animation: pulse 15s infinite alternate; z-index: -1;
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1) translate(5%, 5%); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center relative overflow-hidden text-white">
    <div class="animated-bg"></div>
    
    <div class="glass-panel p-10 rounded-3xl w-[400px] transform transition-all hover:scale-[1.02] duration-500">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl mx-auto mb-4 shadow-lg flex items-center justify-center">
                <span class="text-3xl">🛍️</span>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">Ecosistema POS</h1>
            <p class="text-sm text-slate-300 mt-2 font-light">Portal de Acceso Administrativo</p>
        </div>
        <form id="loginForm" class="space-y-6">
            <div class="space-y-1">
                <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Usuario</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 placeholder-white/30 text-white transition-all" 
                    placeholder="Escribe tu usuario...">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 placeholder-white/30 text-white transition-all" 
                    placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_15px_rgba(168,85,247,0.4)] transform transition active:scale-95 mt-4">
                Iniciar Sesión
            </button>
            <div id="errorMsg" class="hidden text-red-400 text-sm text-center mt-4 font-medium animate-pulse bg-red-900/30 py-2 rounded-lg border border-red-500/30"></div>
        </form>
    </div>

    <script>
        // Si ya hay token, redirigir automáticamente
        if(localStorage.getItem('pos_token')) {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMsg');
            
            btn.innerHTML = '<span class="animate-pulse">Conectando...</span>';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            errorDiv.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append("username", document.getElementById('username').value);
            formData.append("password", document.getElementById('password').value);

            try {
                // Rate Limiter protegido en el Backend (5/minuto)
                const response = await fetch('http://localhost:8000/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                const data = await response.json();
                if(response.ok) {
                    localStorage.setItem('pos_token', data.access_token);
                    window.location.href = 'index.html';
                } else {
                    errorDiv.innerText = data.detail || 'Credenciales incorrectas';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Servidor inalcanzable. Revisa tu conexión.';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Iniciar Sesión';
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
